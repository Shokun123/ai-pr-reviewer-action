name: CI & Action Self-Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run Test Suite
        run: npm test

      - name: Self-Test Action Syntax
        run: node -e "import('./src/reviewer.js').then(m => console.log('✓ Reviewer module syntax OK'));"
