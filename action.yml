name: 'AI PR Code Reviewer & Security Linter'
description: 'Automated AI code review, secret leak detection, and vulnerability audit for every Pull Request.'
author: 'Shokun123'
branding:
  icon: 'shield'
  color: 'yellow'

inputs:
  github-token:
    description: 'GitHub Secret Token used to fetch PR diffs and post review comments.'
    required: true
    default: ${{ github.token }}
  gemini-api-key:
    description: 'Optional Google Gemini API key for advanced cognitive code analysis.'
    required: false
    default: ''
  license-key:
    description: 'Pro license key (Binance UID verification for unlimited scans & enterprise audits).'
    required: false
    default: ''
  fail-on-critical:
    description: 'Whether to fail the CI build when critical security issues are detected.'
    required: false
    default: 'false'

outputs:
  review-status:
    description: 'Status of the code review: clean or issues-found.'
  critical-issues-count:
    description: 'Total number of critical vulnerabilities discovered.'

runs:
  using: 'node24'
  main: 'src/index.js'

